name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --ignore-scripts   # same as Vercel (vercel.json installCommand)
      - run: npm run typecheck
      - run: npm run build
        env: { STUDIO_MODE: demo }
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env: { PARITY_ASSERT: '0', TZ: 'Asia/Kolkata', LANG: 'en_GB.UTF-8' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-output, path: test/output, retention-days: 7 }
